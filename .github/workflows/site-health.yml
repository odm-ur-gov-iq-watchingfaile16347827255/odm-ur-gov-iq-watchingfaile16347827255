name: Site health and GA4 checks

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check:
    if: >
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect custom domain (CNAME)
        id: cname
        run: |
          if [[ -f CNAME ]]; then
            domain=$(cat CNAME | tr -d '\r\n')
            echo "custom_url=https://$domain" >> $GITHUB_OUTPUT
            echo "Found custom domain: $domain"
          else
            echo "custom_url=" >> $GITHUB_OUTPUT
            echo "No CNAME file found."
          fi

      - name: Prepare URL list
        id: prepare
        run: |
          OWNER=${{ github.repository_owner }}
          # repo may appear as owner/repo or just repo; normalize to repo name only
          REPO=${{ github.event.repository.name || github.repository }}
          REPO=${REPO#${OWNER}/}
          USER_URL="https://${OWNER}.github.io/"
          PROJECT_URL="https://${OWNER}.github.io/${REPO}/"
          echo "user_url=$USER_URL" >> $GITHUB_OUTPUT
          echo "project_url=$PROJECT_URL" >> $GITHUB_OUTPUT

      - name: Check URLs
        env:
          CUSTOM_URL: ${{ steps.cname.outputs.custom_url }}
          USER_URL: ${{ steps.prepare.outputs.user_url }}
          PROJECT_URL: ${{ steps.prepare.outputs.project_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          urls=()
          if [[ -n "${CUSTOM_URL}" ]]; then urls+=("${CUSTOM_URL}"); fi
          urls+=("${PROJECT_URL}" "${USER_URL}")

          status_ok() { local code="$1"; [[ "$code" -ge 200 && "$code" -lt 400 ]]; }

          for url in "${urls[@]}"; do
            echo "---- Checking $url"
            code=$(curl -sSI -o /dev/null -w "%{http_code}" -L "$url" || true)
            echo "HTTP status: $code"
            if ! status_ok "$code"; then
              echo "Error: non-success status $code for $url" >&2
              exit 1
            fi

            curl -sSL "$url" -o page.html

            # Expect exactly one GA4 loader
            count=$(grep -oE 'https://www\\.googletagmanager\\.com/gtag/js\\?id=G-58SDZGZF8B' page.html | wc -l | tr -d ' ')
            echo "gtag loader occurrences: $count"
            if [[ "$count" -ne 1 ]]; then
              echo "Error: Expected exactly 1 GA4 gtag loader, found $count at $url" >&2
              exit 1
            fi

            # Preconnect is recommended (warn only)
            if ! grep -q '<link rel="preconnect" href="https://www.googletagmanager.com"' page.html; then
              echo "Warning: preconnect to www.googletagmanager.com not found at $url" >&2
            fi

            # Ensure gtag.js itself is reachable
            scode=$(curl -sSI -o /dev/null -w "%{http_code}" "https://www.googletagmanager.com/gtag/js?id=G-58SDZGZF8B")
            echo "gtag.js status: $scode"
            if ! status_ok "$scode"; then
              echo "Error: gtag.js did not return success ($scode)" >&2
              exit 1
            fi

            safe=$(echo "$url" | sed 's|https\?://||; s|/|_|g')
            mv page.html "artifacts/${safe}.html"
          done

      - name: Upload HTML snapshots
        uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: artifacts